version: '3'

vars:
  GRADLE: '{{default "./gradlew" .GRADLE}}'

tasks:
  compile:
    desc: Fast compile check for Fabric client sources
    cmds:
      - chmod +x ./gradlew
      - '{{.GRADLE}} :fabric:compileClientJava'

  clean:
    desc: Clean all module build outputs
    cmds:
      - chmod +x ./gradlew
      - '{{.GRADLE}} clean'

  build:
    desc: Build and collect every supported Minecraft version
    cmds:
      - |
          set -eu
          build_java_home="${JAVA_BUILD_HOME:-${JAVA25_HOME:-}}"
          test -x "$build_java_home/bin/java" || {
            echo "JAVA_BUILD_HOME (or JAVA25_HOME) must point to a JDK that can build every target" >&2
            exit 1
          }
          for target in $(python3 scripts/minecraft_targets.py list); do
            echo "Building Minecraft $target"
            JAVA_HOME="$build_java_home" {{.GRADLE}} --no-daemon -Pmc_target="$target" :fabric:build
            python3 scripts/minecraft_targets.py collect "$target"
          done

  build-target:
    desc: 'Build one manifest target (usage: task build-target TARGET=1.21.8)'
    requires:
      vars: [TARGET]
    cmds:
      - 'python3 scripts/minecraft_targets.py validate "{{.TARGET}}"'
      - '{{.GRADLE}} --no-daemon -Pmc_target="{{.TARGET}}" :fabric:build'
      - 'python3 scripts/minecraft_targets.py collect "{{.TARGET}}"'

  build-1.21.8:
    desc: Build Minecraft 1.21.8 (Java 21 bytecode) and collect its jar
    cmds:
      - task: build-target
        vars: { TARGET: '1.21.8' }

  build-26.1.2:
    desc: Build Minecraft 26.1.2 with Java 25 and collect its jar
    cmds:
      - 'test -n "${JAVA25_HOME:-}" || (echo "JAVA25_HOME must point to a Java 25 JDK" >&2; exit 1)'
      - 'JAVA_HOME="$JAVA25_HOME" task build-target TARGET=26.1.2'

  build-all:
    desc: Alias for the all-version build
    cmds:
      - task: build
