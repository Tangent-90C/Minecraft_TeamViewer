version: '3'

tasks:
  compile:
    desc: Fast compile check for Fabric client sources
    cmds:
      - chmod +x ./gradlew
      - ./gradlew :fabric:compileClientJava

  clean:
    desc: Clean all module build outputs
    cmds:
      - chmod +x ./gradlew
      - ./gradlew clean

  build:
    desc: Build Fabric mod and collect distributable jars
    cmds:
      - chmod +x ./gradlew
      - ./gradlew :fabric:build
      - mkdir -p ./build-artifacts
      - |
          python3 - <<'PY'
          import pathlib
          import re
          import shutil

          root = pathlib.Path('.')
          gradle_properties = (root / 'gradle.properties').read_text(encoding='utf-8')

          def read_property(name: str) -> str:
              match = re.search(rf'^\s*{re.escape(name)}\s*=\s*(.+?)\s*$', gradle_properties, re.MULTILINE)
              if not match:
                  raise SystemExit(f'Missing {name} in gradle.properties')
              return match.group(1)

          mod_version = read_property('mod_version')
          archives_base_name = read_property('archives_base_name')
          output_name = f'{archives_base_name}-{mod_version}.jar'

          build_artifacts_dir = root / 'build-artifacts'
          for old_file in build_artifacts_dir.glob('*.jar'):
              old_file.unlink()

          libs_dir = root / 'fabric' / 'build' / 'libs'
          source_jar = libs_dir / output_name
          if not source_jar.is_file():
              available = sorted(jar.name for jar in libs_dir.glob('*.jar'))
              raise SystemExit(
                  f'Expected distributable jar {output_name} not found in {libs_dir}. '
                  f'Available jars: {available}'
              )

          shutil.copy2(source_jar, build_artifacts_dir / output_name)
          print(f'Created {build_artifacts_dir / output_name}')
          PY