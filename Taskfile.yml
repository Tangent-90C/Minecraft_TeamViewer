version: '3'

vars:
  GRADLE: '{{default "./gradlew" .GRADLE}}'

tasks:
  compile:
    desc: Fast compile check for Fabric client sources
    cmds:
      - chmod +x ./gradlew
      - '{{.GRADLE}} :fabric:compileClientJava'

  clean:
    desc: Clean all module build outputs
    cmds:
      - chmod +x ./gradlew
      - '{{.GRADLE}} clean'

  build:
    desc: Build every release artifact and compile-check all 31 exact Fabric Minecraft releases
    cmds:
      - |
          set -eu
          python3 scripts/minecraft_targets.py prepare-build
          for target in $(python3 scripts/minecraft_targets.py list); do
            echo "Building Fabric Minecraft $target"
            task build-target TARGET="$target"
          done
          task check-all-fabric-runtimes
          for target in $(python3 scripts/minecraft_targets.py list-neoforge); do
            echo "Building NeoForge Minecraft $target"
            task build-neoforge-target TARGET="$target"
          done
          task package-all
          python3 scripts/minecraft_targets.py verify-release-set

  build-target:
    desc: 'Build one Fabric target (usage: task build-target TARGET=1.21.8)'
    requires:
      vars: [TARGET]
    cmds:
      - 'python3 scripts/minecraft_targets.py validate "{{.TARGET}}"'
      - |
          java_home="$(python3 scripts/minecraft_targets.py java-home "{{.TARGET}}")"
          JAVA_HOME="$java_home" {{.GRADLE}} --no-daemon -Pfabric_target="{{.TARGET}}" :fabric:build
          python3 scripts/minecraft_targets.py collect "{{.TARGET}}"

  check-fabric-runtime:
    desc: 'Compile one exact official Minecraft release with its owning Fabric family'
    requires:
      vars: [RUNTIME]
    cmds:
      - 'python3 scripts/minecraft_targets.py validate-runtime "{{.RUNTIME}}"'
      - |
          family="$(python3 scripts/minecraft_targets.py fabric-owner "{{.RUNTIME}}")"
          java_home="$(python3 scripts/minecraft_targets.py java-home "$family")"
          JAVA_HOME="$java_home" {{.GRADLE}} --no-daemon \
            -Pfabric_target="$family" -Pfabric_runtime_version="{{.RUNTIME}}" \
            :fabric:compileClientJava :fabric:verifyMapPluginContracts

  check-all-fabric-runtimes:
    desc: Compile-check every exact official Minecraft release through its Fabric owner
    cmds:
      - |
          set -eu
          for runtime in $(python3 scripts/minecraft_targets.py list-official); do
            echo "Checking exact Fabric Minecraft $runtime"
            task check-fabric-runtime RUNTIME="$runtime"
          done

  build-neoforge-target:
    desc: 'Build one NeoForge target (usage: task build-neoforge-target TARGET=1.21.8)'
    requires:
      vars: [TARGET]
    cmds:
      - 'python3 scripts/minecraft_targets.py validate --loader neoforge "{{.TARGET}}"'
      - |
          java_home="$(python3 scripts/minecraft_targets.py java-home --loader neoforge "{{.TARGET}}")"
          kind="$(python3 scripts/minecraft_targets.py get --loader neoforge "{{.TARGET}}" build_kind)"
          if [ "$kind" = "legacy" ]; then
            root_target="$(python3 scripts/minecraft_targets.py default-target)"
            root_java_home="$(python3 scripts/minecraft_targets.py java-home "$root_target")"
            JAVA_HOME="$root_java_home" {{.GRADLE}} --no-daemon --configure-on-demand prepareLegacyNeoForgeRuntime
            JAVA_HOME="$java_home" neoforge-legacy/gradlew --no-daemon \
              -p neoforge-legacy -Pneoforge_target="{{.TARGET}}" build
          else
            JAVA_HOME="$java_home" {{.GRADLE}} --no-daemon \
              -Pneoforge_target="{{.TARGET}}" :neoforge:build
          fi
          python3 scripts/minecraft_targets.py collect --loader neoforge "{{.TARGET}}"

  build-1.21.8:
    desc: Build Minecraft 1.21.8 (Java 21 bytecode) and collect its jar
    cmds:
      - task: build-target
        vars: { TARGET: '1.21.8' }

  build-26.1.2:
    desc: Build Minecraft 26.1.2 with Java 25 and collect its jar
    cmds:
      - task: build-target
        vars: { TARGET: '26.1.2' }

  build-26.2:
    desc: Build Minecraft 26.2 with Java 25 and collect its jar
    cmds:
      - task: build-target
        vars: { TARGET: '26.2' }

  package-all:
    desc: Assemble and collect the Fabric-only All-in-One Jar from every staged Fabric adapter
    cmds:
      - |
          default_target="$(python3 scripts/minecraft_targets.py default-target)"
          java_home="$(python3 scripts/minecraft_targets.py java-home "$default_target")"
          JAVA_HOME="$java_home" {{.GRADLE}} --no-daemon :universal:build
          python3 scripts/minecraft_targets.py collect-universal

  build-all:
    desc: Alias for the all-version build
    cmds:
      - task: build
