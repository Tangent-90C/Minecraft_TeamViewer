name: Qodana

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
      - 'releases/**'

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana (${{ matrix.label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: java17-fabric
            label: Java 17 / Fabric 1.20.4
            config: .qodana/qodana-jdk21.yaml
            analysis_java: '21'
            fabric_target: 1.20.4
            neoforge_target: 1.21.8
            prepare_legacy: false
            post_pr_comment: false
          - id: java17-neoforge
            label: Java 17 / NeoForge 1.20.4
            config: .qodana/qodana-jdk17-legacy.yaml
            analysis_java: '17'
            fabric_target: 1.21.8
            neoforge_target: 1.20.4
            prepare_legacy: true
            post_pr_comment: false
          - id: java21
            label: Java 21 / Minecraft 1.21.11
            config: .qodana/qodana-jdk21.yaml
            analysis_java: '21'
            fabric_target: 1.21.11
            neoforge_target: 1.21.11
            prepare_legacy: false
            post_pr_comment: false
          - id: java25
            label: Java 25 / Minecraft 26.2
            config: qodana.yaml
            analysis_java: '25'
            fabric_target: 26.2
            neoforge_target: 26.2
            prepare_legacy: false
            post_pr_comment: true

    env:
      ORG_GRADLE_PROJECT_fabric_target: ${{ matrix.fabric_target }}
      ORG_GRADLE_PROJECT_neoforge_target: ${{ matrix.neoforge_target }}

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Qodana preparation environment
        uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.prepare_legacy && '21' || matrix.analysis_java }}

      - name: Prepare Java 17 NeoForge runtime
        if: matrix.prepare_legacy
        shell: bash
        run: ./gradlew --no-daemon prepareLegacyNeoForgeRuntime

      - name: Set up analysis Java ${{ matrix.analysis_java }}
        if: matrix.prepare_legacy
        uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.analysis_java }}
          setup-buf: 'false'

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.0
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: --config ${{ matrix.config }}
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          primary-cache-key: qodana-2026.2-native-v3-source-layers-${{ matrix.id }}-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-native-v3-source-layers-${{ matrix.id }}-${{ github.ref }}
          post-pr-comment: ${{ matrix.post_pr_comment }}
          use-annotations: true
          upload-result: true
          artifact-name: qodana-report-${{ matrix.id }}
          push-fixes: none
