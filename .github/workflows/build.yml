name: Team View Relay Mod CI

on:
  workflow_dispatch:
  schedule:
    - cron: '37 18 * * *'
  push:
    branches: ["main", "dev"]
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'third_party/TeamViewRelay-Protocol'
      - 'common/**'
      - 'common-sdk/**'
      - 'client-bootstrap/**'
      - 'fabric-bootstrap/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'neoforge-legacy/**'
      - 'universal/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'Taskfile.yml'
      - 'scripts/**'
  pull_request:
    branches: ["main", "dev"]
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'third_party/TeamViewRelay-Protocol'
      - 'common/**'
      - 'common-sdk/**'
      - 'client-bootstrap/**'
      - 'fabric-bootstrap/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'neoforge-legacy/**'
      - 'universal/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'Taskfile.yml'
      - 'scripts/**'

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      shared-java: ${{ steps.targets.outputs.shared-java }}
      packaging-java: ${{ steps.targets.outputs.packaging-java }}
      full-fabric-matrix: ${{ steps.targets.outputs.full-fabric-matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test target manifest tooling
        shell: bash
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate target manifest
        id: targets
        shell: bash
        run: |
          python3 scripts/minecraft_targets.py list
          echo "matrix=$(python3 scripts/minecraft_targets.py ci-matrix)" >> "$GITHUB_OUTPUT"
          echo "shared-java=$(python3 scripts/minecraft_targets.py shared-java)" >> "$GITHUB_OUTPUT"
          echo "packaging-java=$(python3 scripts/minecraft_targets.py packaging-java)" >> "$GITHUB_OUTPUT"
          echo "full-fabric-matrix=$(python3 scripts/minecraft_targets.py full-fabric-ci-matrix)" >> "$GITHUB_OUTPUT"

  common-java17:
    runs-on: ubuntu-latest
    needs: manifest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
      - name: Resolve Buf binary
        shell: bash
        run: echo "BUF_BIN=$(command -v buf)" >> "$GITHUB_ENV"
      - name: Set up shared Java ${{ needs.manifest.outputs.shared-java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ needs.manifest.outputs.shared-java }}'
          distribution: temurin
          cache: gradle
      - name: Test Java 17 shared runtime and bootstrap
        shell: bash
        # Avoid configuring Fabric Loom, whose Gradle plugin itself requires Java 21.
        run: ./gradlew --no-daemon --configure-on-demand :common:test :common:legacyGsonTest :common-sdk:build :client-bootstrap:build :fabric-bootstrap:build

  target-build:
    runs-on: ubuntu-latest
    needs: manifest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.manifest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
      - name: Resolve Buf binary
        shell: bash
        run: echo "BUF_BIN=$(command -v buf)" >> "$GITHUB_ENV"
      - name: Set up Gradle Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java }}'
          distribution: temurin
          cache: gradle
      - name: Setup Task
        uses: arduino/setup-task@v2
      - name: Build ${{ matrix.loader }} Minecraft ${{ matrix.minecraft }}
        shell: bash
        run: |
          if [[ "${{ matrix.loader }}" == "fabric" ]]; then
            task build-target TARGET="${{ matrix.minecraft }}"
          else
            task build-neoforge-target TARGET="${{ matrix.minecraft }}"
          fi
      - name: Upload standalone Jar
        uses: actions/upload-artifact@v4
        with:
          name: team-view-relay-standalone-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: build-artifacts/*.jar
          if-no-files-found: error
      - name: Upload internal slim adapter
        if: matrix.loader == 'fabric'
        uses: actions/upload-artifact@v4
        with:
          name: team-view-relay-adapter-fabric-${{ matrix.minecraft }}
          path: build/adapter-artifacts/*.jar
          if-no-files-found: error

  full-fabric-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: manifest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.manifest.outputs.full-fabric-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
      - name: Resolve Buf binary
        shell: bash
        run: echo "BUF_BIN=$(command -v buf)" >> "$GITHUB_ENV"
      - name: Set up Gradle Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java }}'
          distribution: temurin
          cache: gradle
      - name: Setup Task
        uses: arduino/setup-task@v2
      - name: Compile exact Fabric runtime ${{ matrix.release }}
        run: task check-fabric-runtime RUNTIME="${{ matrix.release }}"

  universal-package:
    runs-on: ubuntu-latest
    needs: [manifest, common-java17, target-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
      - name: Resolve Buf binary
        shell: bash
        run: echo "BUF_BIN=$(command -v buf)" >> "$GITHUB_ENV"
      - name: Set up universal packaging Java ${{ needs.manifest.outputs.packaging-java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ needs.manifest.outputs.packaging-java }}'
          distribution: temurin
          cache: gradle
      - name: Download standalone Jars
        uses: actions/download-artifact@v4
        with:
          pattern: team-view-relay-standalone-*
          path: build-artifacts
          merge-multiple: true
      - name: Download slim adapters
        uses: actions/download-artifact@v4
        with:
          pattern: team-view-relay-adapter-*
          path: build/adapter-artifacts
          merge-multiple: true
      - name: Package and verify All-in-One
        shell: bash
        run: |
          ./gradlew --no-daemon :universal:build
          python3 scripts/minecraft_targets.py collect-universal
          python3 scripts/minecraft_targets.py verify-release-set
      - name: Upload official release Jars
        uses: actions/upload-artifact@v4
        with:
          name: team-view-relay-all-release-jars
          path: build-artifacts/*.jar
          if-no-files-found: error
