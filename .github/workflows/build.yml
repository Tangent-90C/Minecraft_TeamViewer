# Team View Relay Mod GitHub Actions 配置
name: Team View Relay Mod CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'third_party/TeamViewRelay-Protocol'
      - 'common/buf.gen.yaml'
      - 'gradle/minecraft-versions.properties'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'Taskfile.yml'
      - 'common/**'
      - 'fabric/**'
      - 'forge/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'third_party/TeamViewRelay-Protocol'
      - 'common/buf.gen.yaml'
      - 'gradle/minecraft-versions.properties'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'Taskfile.yml'
      - 'common/**'
      - 'fabric/**'
      - 'forge/**'

jobs:
  build:
    # 使用最新的Ubuntu系统
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.8'
            java: '21'
            task: 'build'
          - minecraft: '26.1.2'
            java: '25'
            task: 'build-26.1.2'

    steps:
      # 1. 检出代码仓库
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Sync protocol submodule
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Submodule sync attempt ${attempt}"
            git submodule sync --recursive
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              test -d third_party/TeamViewRelay-Protocol/proto
              git submodule status
              exit 0
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              echo "Submodule update failed after ${attempt} attempts" >&2
              exit 1
            fi
            rm -rf third_party/TeamViewRelay-Protocol
            sleep $((attempt * 5))
          done

      # 2. 设置环境
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Resolve Buf binary
        shell: bash
        run: |
          buf_path="$(command -v buf)"
          test -n "$buf_path"
          echo "BUF_BIN=$buf_path" >> "$GITHUB_ENV"
          "$buf_path" --version

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java }}'
          distribution: 'temurin'
          cache: 'gradle' # 自动缓存Gradle依赖
          cache-dependency-path: 'build.gradle' # 指定Mod的Gradle文件

      - name: Setup Task
        uses: arduino/setup-task@v2

      # 3. 开始编译

      - name: Build Minecraft ${{ matrix.minecraft }}
        shell: bash
        run: |
          if [[ "${{ matrix.java }}" == "25" ]]; then
            export JAVA25_HOME="$JAVA_HOME"
          fi
          task ${{ matrix.task }}

      - name: Read artifact versions
        id: versions
        shell: bash
        run: |
          mod_version=$(python3 -c "import re;print(re.search(r'^\s*mod_version\s*=\s*(.+?)\s*$', open('gradle.properties', encoding='utf-8').read(), re.M).group(1))")
          archives_base_name=$(python3 -c "import re;print(re.search(r'^\s*archives_base_name\s*=\s*(.+?)\s*$', open('gradle.properties', encoding='utf-8').read(), re.M).group(1))")
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "archives_base_name=${archives_base_name}" >> "$GITHUB_OUTPUT"
      
      # 上传编译产物
      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: team-view-relay-${{ matrix.minecraft }}-${{ steps.versions.outputs.mod_version }}
          path: build-artifacts/*.jar
          if-no-files-found: error
                  
