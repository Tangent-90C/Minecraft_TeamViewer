# Team View Relay Mod GitHub Actions 配置
name: Team View Relay Mod CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'third_party/TeamViewRelay-Protocol'
      - 'common/buf.gen.yaml'
      - 'common/**'
      - 'fabric/**'
      - 'forge/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'third_party/TeamViewRelay-Protocol'
      - 'common/buf.gen.yaml'
      - 'common/**'
      - 'fabric/**'
      - 'forge/**'

jobs:
  build:
    # 使用最新的Ubuntu系统
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 检出代码仓库
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 设置环境
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # 自动缓存Gradle依赖
          cache-dependency-path: 'build.gradle' # 指定Mod的Gradle文件

      - name: Setup Task
        uses: arduino/setup-task@v2

      # 3. 开始编译

      - name: Build versioned artifacts with Task
        shell: bash
        run: task build

      - name: Read artifact versions
        id: versions
        shell: bash
        run: |
          mod_version=$(python3 -c "import re;print(re.search(r'^\s*mod_version\s*=\s*(.+?)\s*$', open('gradle.properties', encoding='utf-8').read(), re.M).group(1))")
          archives_base_name=$(python3 -c "import re;print(re.search(r'^\s*archives_base_name\s*=\s*(.+?)\s*$', open('gradle.properties', encoding='utf-8').read(), re.M).group(1))")
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "archives_base_name=${archives_base_name}" >> "$GITHUB_OUTPUT"
      
      # 上传编译产物
      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: team-view-relay-mod-${{ steps.versions.outputs.mod_version }}
          path: build-artifacts/${{ steps.versions.outputs.archives_base_name }}-${{ steps.versions.outputs.mod_version }}.jar
          if-no-files-found: error
                  
