name: dependency-submission

on:
  push:
    branches: [ "main"]
    paths:
      - '.github/actions/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'common/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'neoforge-adapter/**'
  pull_request:
    branches: [ "main"]
    paths:
      - '.github/actions/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'common/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'neoforge-adapter/**'

jobs:

  java-dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - name: Set up dependency submission environment
      uses: ./.github/actions/setup-build
      with:
        java-version: '21'
        setup-buf: 'false'
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v5
