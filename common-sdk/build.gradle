plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-common-sdk"
}

sourceSets {
    main {
        java {
            srcDir("../common/src/main/java")
            include("fun/prof_chen/teamviewer/main_code/battlemap/BattleMapObservationClock.java")
            include("fun/prof_chen/teamviewer/main_code/battlemap/ScoreboardSnapshot.java")
            include("fun/prof_chen/teamviewer/api/PlayerRelation.java")
            include("fun/prof_chen/teamviewer/api/PlayerRelationOrigin.java")
            include("fun/prof_chen/teamviewer/api/Attackability.java")
            include("fun/prof_chen/teamviewer/api/PlayerInteractionState.java")
            include("fun/prof_chen/teamviewer/api/RemotePlayerSnapshot.java")
            include("fun/prof_chen/teamviewer/api/RemotePlayerView.java")
            include("fun/prof_chen/teamviewer/api/RemotePlayerViewBatch.java")
            include("fun/prof_chen/teamviewer/api/RemotePlayerBatch.java")
            include("fun/prof_chen/teamviewer/api/LastSeenPlayerSnapshot.java")
            include("fun/prof_chen/teamviewer/api/LastSeenPlayerBatch.java")
            include("fun/prof_chen/teamviewer/main_code/client/bridge/GameClientBridge.java")
            include("fun/prof_chen/teamviewer/main_code/client/entity/EntityCaptureTarget.java")
            include("fun/prof_chen/teamviewer/main_code/client/entity/EntityCaptureFrame.java")
            include("fun/prof_chen/teamviewer/main_code/client/entity/EntityUploadFilter.java")
            include("fun/prof_chen/teamviewer/main_code/client/model/**")
            include("fun/prof_chen/teamviewer/main_code/client/sdk/**")
            include("fun/prof_chen/teamviewer/main_code/config/TeamviewerModMetadata.java")
            include("fun/prof_chen/teamviewer/main_code/config/ui/**")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigUiSession.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/PluginManagerUiSession.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/PluginRuntimeStateText.java")
            include("fun/prof_chen/teamviewer/main_code/hud/abstraction/HudRenderSink.java")
            include("fun/prof_chen/teamviewer/main_code/hud/model/**")
            include("fun/prof_chen/teamviewer/main_code/mapbridge/implementor/**")
            include("fun/prof_chen/teamviewer/main_code/mapbridge/model/**")
            include("fun/prof_chen/teamviewer/main_code/model/Position3D.java")
            include("fun/prof_chen/teamviewer/main_code/model/RemotePlayerInfo.java")
            include("fun/prof_chen/teamviewer/main_code/model/LastSeenPlayerInfo.java")
            include("fun/prof_chen/teamviewer/main_code/model/ReportDataSchemas.java")
            include("fun/prof_chen/teamviewer/main_code/network/abstraction/RuntimeGateway.java")
            include("fun/prof_chen/teamviewer/main_code/plugin/MinecraftClientObjects.java")
            include("fun/prof_chen/teamviewer/main_code/renderbridge/abstraction/**")
            include("fun/prof_chen/teamviewer/main_code/renderbridge/model/**")
            include("fun/prof_chen/teamviewer/main_code/renderbridge/core/WorldRenderBatchCompiler.java")
        }
    }
}

def targetJavaVersion = rootProject.ext.sharedJavaRelease as int

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(targetJavaVersion)
}

def verifySdkBoundary = tasks.register("verifySdkBoundary") {
    group = "verification"
    description = "Ensure Common Adapter SDK sources remain Loader and game independent."
    inputs.files(sourceSets.main.allJava)
    doLast {
        def forbidden = ["import net.minecraft.", "import net.fabricmc.", "import net.neoforged.",
                         "import net.minecraftforge.", "import journeymap.", "import xaero."]
        def violations = []
        inputs.files.files.sort().each { sourceFile ->
            sourceFile.eachLine { line, lineNumber ->
                if (forbidden.any { line.trim().startsWith(it) }) {
                    violations << "${sourceFile}:$lineNumber: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) throw new GradleException("Platform API leaked into common-sdk:\n" + violations.join("\n"))
    }
}

tasks.named("check") {
    dependsOn(verifySdkBoundary)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-common-sdk"
            from components.java
        }
    }
}
