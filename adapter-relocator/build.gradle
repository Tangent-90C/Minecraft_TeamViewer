plugins {
    id 'java-library'
}

dependencies {
    implementation "org.ow2.asm:asm:${project.asm_version}"
    implementation "org.ow2.asm:asm-commons:${project.asm_version}"
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

def relocatorMainClassEntry = "fun/prof_chen/teamviewer/buildtools/AdapterRelocator.class"
def verifyRelocatorJar = tasks.register("verifyRelocatorJar") {
    group = "verification"
    description = "Verify the NeoForge adapter relocator executable is packaged."
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar").flatMap { it.archiveFile })
    doLast {
        def artifact = tasks.named("jar").get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            if (zip.getEntry(relocatorMainClassEntry) == null) {
                throw new GradleException(
                        "Adapter relocator Jar is missing ${relocatorMainClassEntry}; " +
                                "check that its source directory is tracked by Git")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("check") {
    dependsOn(verifyRelocatorJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(rootProject.ext.sharedJavaRelease as int)
}

java {
    def javaVersion = JavaVersion.toVersion(rootProject.ext.sharedJavaRelease as int)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.sharedJavaRelease as int)
    }
}
