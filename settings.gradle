pluginManagement {
    def versionProperties = new Properties()
    file("gradle/minecraft-versions.properties").withInputStream {
        versionProperties.load(it)
    }
    def defaultTarget = versionProperties.getProperty("default_fabric_target")
    def selectedTarget = providers.gradleProperty("fabric_target")
            .getOrElse(defaultTarget)
    def supportedTargets = versionProperties.getProperty("fabric_targets")
            .split(",")
            .collect { it.trim() }
    if (!supportedTargets.contains(selectedTarget)) {
        throw new GradleException(
                "Unsupported Fabric target '${selectedTarget}'. Supported targets: ${supportedTargets.join(', ')}")
    }

    repositories {
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }

    plugins {
        id 'fabric-loom' version versionProperties.getProperty("fabric.${selectedTarget}.loom_version")
        id 'net.fabricmc.fabric-loom' version versionProperties.getProperty("fabric.${selectedTarget}.loom_version")
        id 'net.neoforged.moddev' version versionProperties.getProperty('neoforge_moddev_version')
    }
}

plugins {
    // Some Minecraft tooling requests an older Java launcher than the Gradle
    // runtime (for example, NeoForge 26.2 runs Gradle on 25 but assets on 21).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "TeamViewRelay"

include("common")
include("common-sdk")
include("client-bootstrap")
include("fabric-bootstrap")
include("fabric")
include("neoforge")
include("universal")
