plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-common"
}

dependencies {
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okio:okio-jvm:3.6.0"
    compileOnly "org.slf4j:slf4j-api:2.0.16"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.18.6"
    implementation "com.fasterxml.jackson.core:jackson-core:2.18.6"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.18.6"
    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    implementation "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.16"
}

def protoModuleDir = rootProject.file("third_party/TeamViewRelay-Protocol")
def protoInputDir = new File(protoModuleDir, "proto")
def bufTemplateFile = file("buf.gen.yaml")
def generatedProtoJavaDir = file("${buildDir}/generated/source/proto/main/java")
def resolvedBufBinary = System.getenv("BUF_BIN") ?: (file("/tmp/buf/bin/buf").exists() ? "/tmp/buf/bin/buf" : "buf")
def protoSources = project.fileTree(protoInputDir) {
    include("**/*.proto")
}

sourceSets {
    main {
        java.srcDirs = ["src/main/java", generatedProtoJavaDir]
        resources.srcDirs = ["src/main/resources"]
    }
}

tasks.register("generateProtoJava", Exec) {
    group = "build setup"
    description = "Generate Java protobuf sources from the shared protocol module."

    inputs.files(protoSources)
    inputs.file(bufTemplateFile)
    outputs.dir(generatedProtoJavaDir)

    doFirst {
        if (!protoInputDir.isDirectory()) {
            throw new GradleException("Shared protocol module not found at ${protoInputDir}")
        }
        delete(generatedProtoJavaDir)
    }

    commandLine resolvedBufBinary, "generate", protoInputDir.absolutePath, "--template", bufTemplateFile.absolutePath
}

processResources {
    inputs.property "network_protocol_version", project.network_protocol_version
    inputs.property "network_min_compatible_protocol_version", project.network_min_compatible_protocol_version
    filteringCharset = "UTF-8"

    filesMatching("teamviewer-build.properties") {
        expand(
                "network_protocol_version": project.network_protocol_version,
                "network_min_compatible_protocol_version": project.network_min_compatible_protocol_version
        )
    }
}

def targetJavaVersion = 21

tasks.withType(JavaCompile).configureEach {
    dependsOn(tasks.named("generateProtoJava"))
    options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register("verifyPlatformBoundary") {
    group = "verification"
    description = "Ensure common main sources do not import Minecraft, Fabric, or optional map APIs."
    inputs.files(fileTree("src/main/java") { include "**/*.java" })

    doLast {
        def forbiddenImports = [
                "import net.minecraft.",
                "import net.fabricmc.",
                "import journeymap.",
                "import xaero."
        ]
        def violations = []
        inputs.files.files.sort().each { sourceFile ->
            sourceFile.eachLine { line, lineNumber ->
                if (forbiddenImports.any { line.trim().startsWith(it) }) {
                    violations << "${sourceFile}:$lineNumber: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Platform imports leaked into common main sources:\n" + violations.join("\n"))
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyPlatformBoundary"))
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.named("sourcesJar") {
    dependsOn(tasks.named("generateProtoJava"))
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-common"
            from components.java
        }
    }
}
