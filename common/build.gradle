plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-common"
}

dependencies {
    api project(":common-sdk")
    implementation "com.google.code.gson:gson:${project.gson_version}"
    implementation "com.squareup.okhttp3:okhttp:${project.okhttp_version}"
    implementation "com.squareup.okio:okio-jvm:${project.okio_version}"
    compileOnly "org.slf4j:slf4j-api:${project.slf4j_version}"
    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    implementation "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"
    implementation "org.luaj:luaj-jse:${project.luaj_version}"
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.slf4j:slf4j-simple:${project.slf4j_version}"
}

def protoModuleDir = rootProject.file("third_party/TeamViewRelay-Protocol")
def protoInputDir = new File(protoModuleDir, "proto")
def bufTemplateFile = file("buf.gen.yaml")
def generatedProtoJavaDir = file("${buildDir}/generated/source/proto/main/java")
def resolvedBufBinary = System.getenv("BUF_BIN") ?: (file("/tmp/buf/bin/buf").exists() ? "/tmp/buf/bin/buf" : "buf")
def protoSources = project.fileTree(protoInputDir) {
    include("**/*.proto")
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", generatedProtoJavaDir]
            exclude("fun/prof_chen/teamviewer/main_code/battlemap/BattleMapObservationClock.java")
            exclude("fun/prof_chen/teamviewer/main_code/battlemap/ScoreboardSnapshot.java")
            exclude("fun/prof_chen/teamviewer/main_code/client/bridge/GameClientBridge.java")
            exclude("fun/prof_chen/teamviewer/main_code/client/model/**")
            exclude("fun/prof_chen/teamviewer/main_code/client/sdk/**")
            exclude("fun/prof_chen/teamviewer/main_code/config/TeamviewerModMetadata.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigControlId.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigControlKind.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigControlView.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigPageId.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigPageView.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigUiAction.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigUiController.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/ConfigUiSessions.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/UiRect.java")
            exclude("fun/prof_chen/teamviewer/main_code/config/ui/UiText.java")
            exclude("fun/prof_chen/teamviewer/main_code/hud/abstraction/HudRenderSink.java")
            exclude("fun/prof_chen/teamviewer/main_code/hud/model/**")
            exclude("fun/prof_chen/teamviewer/main_code/mapbridge/implementor/**")
            exclude("fun/prof_chen/teamviewer/main_code/mapbridge/model/**")
            exclude("fun/prof_chen/teamviewer/main_code/model/Position3D.java")
            exclude("fun/prof_chen/teamviewer/main_code/model/RemotePlayerInfo.java")
            exclude("fun/prof_chen/teamviewer/main_code/model/ReportDataSchemas.java")
            exclude("fun/prof_chen/teamviewer/main_code/network/abstraction/RuntimeGateway.java")
            exclude("fun/prof_chen/teamviewer/main_code/plugin/MinecraftClientObjects.java")
            exclude("fun/prof_chen/teamviewer/main_code/renderbridge/abstraction/**")
            exclude("fun/prof_chen/teamviewer/main_code/renderbridge/model/**")
        }
        resources.srcDirs = ["src/main/resources"]
    }
}

tasks.register("generateProtoJava", Exec) {
    group = "build setup"
    description = "Generate Java protobuf sources from the shared protocol module."

    inputs.files(protoSources)
    inputs.file(bufTemplateFile)
    outputs.dir(generatedProtoJavaDir)

    doFirst {
        if (!protoInputDir.isDirectory()) {
            throw new GradleException("Shared protocol module not found at ${protoInputDir}")
        }
        delete(generatedProtoJavaDir)
    }

    commandLine resolvedBufBinary, "generate", protoInputDir.absolutePath, "--template", bufTemplateFile.absolutePath
}

processResources {
    inputs.property "network_protocol_version", project.network_protocol_version
    inputs.property "network_min_compatible_protocol_version", project.network_min_compatible_protocol_version
    filteringCharset = "UTF-8"

    filesMatching("teamviewer-build.properties") {
        expand(
                "network_protocol_version": project.network_protocol_version,
                "network_min_compatible_protocol_version": project.network_min_compatible_protocol_version
        )
    }
}

def targetJavaVersion = rootProject.ext.sharedJavaRelease as int

tasks.withType(JavaCompile).configureEach {
    dependsOn(tasks.named("generateProtoJava"))
    options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// NeoForge loads every JarJar dependency as a named JPMS module. common-sdk
// and common intentionally keep a compile-time boundary while sharing domain
// packages, so they must be one runtime module in NeoForge production jars.
def neoForgeRuntimeJar = tasks.register("neoForgeRuntimeJar", Jar) {
    group = "build"
    description = "Merge common-sdk and common into one NeoForge runtime module."
    archiveClassifier = "neoforge-runtime"
    dependsOn(tasks.named("classes"), project(":common-sdk").tasks.named("classes"))
    from(sourceSets.main.output)
    from(project(":common-sdk").sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes("Automatic-Module-Name": "fun.prof.chen.TeamViewRelay.common.runtime")
    }
}

configurations {
    neoForgeRuntimeElements {
        canBeConsumed = true
        canBeResolved = false
        outgoing.capability("${project.group}:${project.name}-neoforge-runtime:${project.version}")
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, targetJavaVersion)
        }
    }
}

artifacts {
    neoForgeRuntimeElements(neoForgeRuntimeJar)
}

tasks.register("verifyPlatformBoundary") {
    group = "verification"
    description = "Ensure common main sources do not import Minecraft, Fabric, or optional map APIs."
    inputs.files(fileTree("src/main/java") { include "**/*.java" })

    doLast {
        def forbiddenImports = [
                "import net.minecraft.",
                "import net.fabricmc.",
                "import net.neoforged.",
                "import net.minecraftforge.",
                "import journeymap.",
                "import xaero."
        ]
        def violations = []
        inputs.files.files.sort().each { sourceFile ->
            sourceFile.eachLine { line, lineNumber ->
                if (forbiddenImports.any { line.trim().startsWith(it) }) {
                    violations << "${sourceFile}:$lineNumber: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Platform imports leaked into common main sources:\n" + violations.join("\n"))
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyPlatformBoundary"))
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.named("sourcesJar") {
    dependsOn(tasks.named("generateProtoJava"))
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-common"
            from components.java
        }
    }
}
