plugins {
    id 'fabric-loom' apply false
    id 'net.fabricmc.fabric-loom' apply false
    id 'maven-publish'
}

def minecraftVersionProperties = new Properties()
rootProject.file("gradle/minecraft-versions.properties").withInputStream {
    minecraftVersionProperties.load(it)
}
def defaultMinecraftTarget = minecraftVersionProperties.getProperty("default_target")
def minecraftTarget = providers.gradleProperty("mc_target").getOrElse(defaultMinecraftTarget)
def supportedMinecraftTargets = minecraftVersionProperties.getProperty("supported_targets")
        .split(",")
        .collect { it.trim() }
if (!supportedMinecraftTargets.contains(minecraftTarget)) {
    throw new GradleException("Unsupported mc_target '${minecraftTarget}'. Supported targets: ${supportedMinecraftTargets.join(', ')}")
}
def profileProperty = { String name ->
    def value = minecraftVersionProperties.getProperty("${minecraftTarget}.${name}")
    if (value == null || value.isBlank()) {
        throw new GradleException("Missing ${name} for Minecraft target ${minecraftTarget}")
    }
    value
}
def minecraftTargetVersion = profileProperty("minecraft_target_version")
def minecraftAdapterVersion = profileProperty("minecraft_adapter_version")
def targetJavaVersion = profileProperty("java_version").toInteger()
def loaderVersion = profileProperty("loader_version")
def fabricApiVersion = profileProperty("fabric_api_version")
def mappingsMode = profileProperty("mappings_mode")
def modmenuVersion = profileProperty("modmenu_version")
def journeyMapDependency = profileProperty("journeymap_dependency")
def journeyMapApiJar = layout.buildDirectory.file(
        "generated/journeymap-api/META-INF/jars/journeymap-api-fabric-2.0.0-26.1.jar")

apply plugin: mappingsMode == "yarn" ? "fabric-loom" : "net.fabricmc.fabric-loom"

base {
    archivesName = minecraftTarget == defaultMinecraftTarget
            ? project.archives_base_name
            : "${project.archives_base_name}-${minecraftTargetVersion}"
}

if (minecraftTarget != defaultMinecraftTarget) {
    layout.buildDirectory = file("build/${minecraftTarget}")
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "teamviewer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "JourneyMap"
        url = "https://jm.gserv.me/repository/maven-snapshots/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ["src/main/java"]
        resources.srcDirs = ["src/main/resources"]
    }
    client {
        java.srcDirs = minecraftTarget == defaultMinecraftTarget
                ? ["src/client/java", "../common/src/version/${minecraftAdapterVersion}/java"]
                : ["src/version/${minecraftAdapterVersion}/java", "../common/src/version/${minecraftAdapterVersion}/java"]
        resources.srcDirs = minecraftTarget == defaultMinecraftTarget
                ? ["src/client/resources", "../common/src/version/${minecraftAdapterVersion}/resources"]
                : ["src/version/${minecraftAdapterVersion}/resources", "../common/src/version/${minecraftAdapterVersion}/resources"]
    }
}

configurations.configureEach {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            def group = details.requested.group
            def name = details.requested.name
            def jacksonRequiredVersion = "2.18.6"
            def jsonRequiredVersion = "2.5.2"

            if (group == 'com.fasterxml.jackson.core' && (name == 'jackson-core' || name == 'jackson-databind' || name == 'jackson-annotations')) {
                details.useVersion jacksonRequiredVersion
                if (details.requested.version) {
                    logger.warn("检测到 ${group}:${name} 请求版本 ${details.requested.version}，已强制升级至 >= ${jacksonRequiredVersion}")
                }
            } else if (group == 'net.minidev' && name == 'json-smart') {
                details.useVersion "[${jsonRequiredVersion},)"
                if (details.requested.version) {
                    logger.warn("检测到 ${group}:${name} 请求版本 ${details.requested.version}，已强制升级至 >= ${jsonRequiredVersion}")
                }
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftTargetVersion}"
    if (mappingsMode == "yarn") {
        mappings "net.fabricmc:yarn:${profileProperty('yarn_mappings')}:v2"
    } else if (mappingsMode != "none") {
        throw new GradleException("Unsupported mappings mode '${mappingsMode}' for ${minecraftTarget}")
    }
    if (mappingsMode == "yarn") {
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        modLocalRuntime "com.terraformersmc:modmenu:${modmenuVersion}"
        modCompileOnly journeyMapDependency
    } else {
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        compileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        runtimeOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        compileOnly journeyMapDependency
        compileOnly files(journeyMapApiJar)
    }

    implementation project(":common")
    include project(":common")

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    include "com.squareup.okhttp3:okhttp:4.12.0"

    implementation "com.squareup.okio:okio-jvm:3.6.0"
    include "com.squareup.okio:okio-jvm:3.6.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"
    include "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"

    implementation "com.fasterxml.jackson.core:jackson-annotations:2.18.6"
    include "com.fasterxml.jackson.core:jackson-annotations:2.18.6"

    implementation "com.fasterxml.jackson.core:jackson-core:2.18.6"
    include "com.fasterxml.jackson.core:jackson-core:2.18.6"

    implementation "com.fasterxml.jackson.core:jackson-databind:2.18.6"
    include "com.fasterxml.jackson.core:jackson-databind:2.18.6"

    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    include "com.google.protobuf:protobuf-java:${project.protobuf_version}"

    implementation "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"
    include "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"
}

if (mappingsMode == "none") {
    configurations {
        journeyMapApiBundle
    }
    dependencies {
        journeyMapApiBundle journeyMapDependency
    }
    tasks.register("extractJourneyMapApi", Copy) {
        from({ zipTree(configurations.journeyMapApiBundle.singleFile) }) {
            include "META-INF/jars/journeymap-api-fabric-2.0.0-26.1.jar"
        }
        into layout.buildDirectory.dir("generated/journeymap-api")
    }
    tasks.named("compileClientJava") {
        dependsOn tasks.named("extractJourneyMapApi")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraftTargetVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraftTargetVersion,
                "loader_version": loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE.txt")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
