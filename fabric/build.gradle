plugins {
    id 'fabric-loom' apply false
    id 'net.fabricmc.fabric-loom' apply false
    id 'maven-publish'
}

evaluationDependsOn(":fabric-bootstrap")

def minecraftVersionProperties = new Properties()
rootProject.file("gradle/minecraft-versions.properties").withInputStream {
    minecraftVersionProperties.load(it)
}
def defaultMinecraftTarget = minecraftVersionProperties.getProperty("default_target")
def minecraftTarget = providers.gradleProperty("mc_target").getOrElse(defaultMinecraftTarget)
def supportedMinecraftTargets = minecraftVersionProperties.getProperty("supported_targets")
        .split(",")
        .collect { it.trim() }
if (!supportedMinecraftTargets.contains(minecraftTarget)) {
    throw new GradleException("Unsupported mc_target '${minecraftTarget}'. Supported targets: ${supportedMinecraftTargets.join(', ')}")
}
def profileProperty = { String name ->
    def value = minecraftVersionProperties.getProperty("${minecraftTarget}.${name}")
    if (value == null || value.isBlank()) {
        throw new GradleException("Missing ${name} for Minecraft target ${minecraftTarget}")
    }
    value
}
def minecraftTargetVersion = profileProperty("minecraft_target_version")
def minecraftAdapterVersion = profileProperty("minecraft_adapter_version")
def targetJavaVersion = profileProperty("adapter_java_release").toInteger()
def gameJavaVersion = profileProperty("game_java_version").toInteger()
def sharedJavaVersion = minecraftVersionProperties.getProperty("shared_java_release").toInteger()
def loaderVersion = profileProperty("loader_version")
def fabricApiVersion = profileProperty("fabric_api_version")
def fabricApiModId = profileProperty("fabric_api_mod_id")
def mappingsMode = profileProperty("mappings_mode")
def modmenuVersion = profileProperty("modmenu_version")
def journeyMapDependency = profileProperty("journeymap_dependency")
def journeyMapApiJar = layout.buildDirectory.file(
        "generated/journeymap-api/META-INF/jars/journeymap-api-fabric-2.0.0-26.1.jar")

apply plugin: mappingsMode == "yarn" ? "fabric-loom" : "net.fabricmc.fabric-loom"

base {
    archivesName = "${project.archives_base_name}-Fabric-${minecraftTargetVersion}"
}

if (minecraftTarget != defaultMinecraftTarget) {
    layout.buildDirectory = file("build/${minecraftTarget}")
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            runDir = minecraftTarget == defaultMinecraftTarget ? "run" : "run/${minecraftTargetVersion}"
            vmArg "-Dteamviewer.adapterTck.strict=true"
        }
    }

    mods {
        "teamviewer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "JourneyMap"
        url = "https://jm.gserv.me/repository/maven-snapshots/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ["src/main/java"]
        resources.srcDirs = ["src/main/resources"]
    }
    client {
        java.srcDirs = ["src/shared/java", "src/version/${minecraftAdapterVersion}/java"]
        resources.srcDirs = ["src/shared/resources", "src/version/${minecraftAdapterVersion}/resources"]
    }
}

configurations.configureEach {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            def group = details.requested.group
            def name = details.requested.name
            def gsonRequiredVersion = project.gson_version.toString()
            def slf4jRequiredVersion = project.slf4j_version.toString()

            if (group == 'com.google.code.gson' && name == 'gson') {
                details.useVersion gsonRequiredVersion
            } else if (group == 'org.slf4j' && name == 'slf4j-api') {
                details.useVersion slf4jRequiredVersion
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftTargetVersion}"
    if (mappingsMode == "yarn") {
        mappings "net.fabricmc:yarn:${profileProperty('yarn_mappings')}:v2"
    } else if (mappingsMode != "none") {
        throw new GradleException("Unsupported mappings mode '${mappingsMode}' for ${minecraftTarget}")
    }
    if (mappingsMode == "yarn") {
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        modLocalRuntime "com.terraformersmc:modmenu:${modmenuVersion}"
        modCompileOnly journeyMapDependency
    } else {
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        compileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        runtimeOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        compileOnly journeyMapDependency
        compileOnly files(journeyMapApiJar)
    }

    implementation project(":common")
    include project(":common")
    implementation project(":common-sdk")
    include project(":common-sdk")

    implementation project(":fabric-bootstrap")

    implementation "com.squareup.okhttp3:okhttp:${project.okhttp_version}"
    include "com.squareup.okhttp3:okhttp:${project.okhttp_version}"

    implementation "com.squareup.okio:okio-jvm:${project.okio_version}"
    include "com.squareup.okio:okio-jvm:${project.okio_version}"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
    include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"

    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    include "com.google.protobuf:protobuf-java:${project.protobuf_version}"

    implementation "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"
    include "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"

    implementation "org.luaj:luaj-jse:${project.luaj_version}"
    include "org.luaj:luaj-jse:${project.luaj_version}"
}

if (mappingsMode == "none") {
    configurations {
        journeyMapApiBundle
    }
    dependencies {
        journeyMapApiBundle journeyMapDependency
    }
    tasks.register("extractJourneyMapApi", Copy) {
        from({ zipTree(configurations.journeyMapApiBundle.singleFile) }) {
            include "META-INF/jars/journeymap-api-fabric-2.0.0-26.1.jar"
        }
        into layout.buildDirectory.dir("generated/journeymap-api")
    }
    tasks.named("compileClientJava") {
        dependsOn tasks.named("extractJourneyMapApi")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraftTargetVersion
    inputs.property "loader_version", loaderVersion
    inputs.property "fabric_api_mod_id", fabricApiModId
    inputs.property "java_version", gameJavaVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraftTargetVersion,
                "loader_version": loaderVersion,
                "fabric_api_mod_id": fabricApiModId,
                "java_version": gameJavaVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.register("verifyVersionAdapterBoundary") {
    group = "verification"
    description = "Keep Minecraft version sources behind the Common Adapter SDK boundary."
    inputs.files(fileTree("src/version") { include "**/*.java" }, fileTree("src/shared") { include "**/*.java" })

    doLast {
        def forbiddenImports = [
                "fun.prof_chen.teamviewer.main_code.config.Config",
                "fun.prof_chen.teamviewer.main_code.bridge.NetworkManager",
                "fun.prof_chen.teamviewer.main_code.client.ClientCoordinator",
                "fun.prof_chen.teamviewer.main_code.sync.core.",
                "fun.prof_chen.teamviewer.main_code.sync.impl.repository.",
                "fun.prof_chen.teamviewer.protocol."
        ]
        def violations = []
        inputs.files.files.sort().each { sourceFile ->
            sourceFile.eachLine { line, lineNumber ->
                def trimmed = line.trim()
                if (trimmed.startsWith("import ") && forbiddenImports.any { trimmed.contains(it) }) {
                    violations << "${sourceFile}:$lineNumber: ${trimmed}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Version adapter imported common implementation details:\n" + violations.join("\n"))
        }
    }
}

tasks.register("verifyAdapterSdkCompleteness") {
    group = "verification"
    description = "Verify every supported Minecraft adapter supplies the complete SDK bundle and feature ports."
    inputs.files(fileTree("src/version") { include "**/*.java", "**/*.json" })
    inputs.property("minecraftAdapterVersion", minecraftAdapterVersion)

    doLast {
        [minecraftAdapterVersion].each { adapter ->
            def root = file("src/version/${adapter}")
            def entry = new File(root, "java/fun/prof_chen/teamviewer/main_code/core/FabricClientAdapterFactory.java")
            if (!entry.isFile()) throw new GradleException("Missing ${adapter} adapter factory")
            def text = entry.getText("UTF-8")
            ["implements ClientAdapterFactory<", "new ClientAdapterBundle<>("
            ].each { token ->
                if (!text.contains(token)) throw new GradleException("${adapter} adapter factory missing '${token}'")
            }
            def requiredFiles = [
                    "client/bridge/FabricClientEventBridge.java",
                    "client/bridge/FabricGameClientBridge.java",
                    "battlemap/FabricBattleMapNativeBridge.java",
                    "render/FabricWorldRenderSink.java",
                    "render/FabricHudRenderSink.java",
                    "screen/ConfigScreen.java"
            ]
            requiredFiles.each { relative ->
                if (!new File(root, "java/fun/prof_chen/teamviewer/main_code/${relative}").isFile()) {
                    throw new GradleException("${adapter} adapter missing required port ${relative}")
                }
            }
            def gameBridge = new File(root,
                    "java/fun/prof_chen/teamviewer/main_code/client/bridge/FabricGameClientBridge.java")
            def gameBridgeText = gameBridge.getText("UTF-8")
            if (!gameBridgeText.contains("normalizeMarkTargetDistance(maxDistance)")) {
                throw new GradleException("${adapter} mark targeting must use the SDK distance bound")
            }
            if (adapter == "1.21.8" && gameBridgeText.contains("crosshairTarget")) {
                throw new GradleException(
                        "${adapter} mark targeting must raycast beyond Minecraft's interaction-limited crosshairTarget")
            }
            def mixin = new File(root, "resources/teamviewer.client.mixins.json")
            if (!mixin.isFile() || !mixin.getText("UTF-8").contains("Mixin\"")) {
                throw new GradleException("${adapter} adapter must declare a non-empty Scoreboard Mixin list")
            }
            if (entry.readLines().size() > 120) {
                throw new GradleException("${adapter} FabricClientAdapterFactory must remain a thin adapter factory")
            }
        }
    }
}

tasks.named("compileClientJava") {
    dependsOn(tasks.named("verifyVersionAdapterBoundary"), tasks.named("verifyAdapterSdkCompleteness"))
}

def compileVersionAdapterAgainstSdk = tasks.register("compileVersionAdapterAgainstSdk", JavaCompile) {
    group = "verification"
    description = "Compile Minecraft adapter sources without the common runtime on their classpath."
    dependsOn(project(":common-sdk").tasks.named("classes"))
    if (mappingsMode == "none") {
        dependsOn(tasks.named("extractJourneyMapApi"))
    }
    source(fileTree("src/version/${minecraftAdapterVersion}/java") { include "**/*.java" })
    source(fileTree("src/shared/java") {
        include "fun/prof_chen/teamviewer/main_code/mapbridge/**/*.java"
    })
    classpath = sourceSets.client.compileClasspath - project(":common").sourceSets.main.output
    destinationDirectory.set(layout.buildDirectory.dir("classes/java/adapterSdkBoundary"))
    options.encoding = "UTF-8"
    options.release.set(targetJavaVersion)
}

tasks.named("compileClientJava") {
    dependsOn(compileVersionAdapterAgainstSdk)
}

def verifyNoCommonClassShadowing = tasks.register("verifyNoCommonClassShadowing") {
    group = "verification"
    description = "Reject stale or version-specific bytecode that shadows classes supplied by common."
    dependsOn(tasks.named("compileClientJava"), project(":common").tasks.named("classes"),
            project(":common-sdk").tasks.named("classes"))

    doLast {
        def commonClasses = new HashSet<String>()
        [project(":common"), project(":common-sdk")].each { commonProject ->
            def classesRoot = commonProject.layout.buildDirectory.dir("classes/java/main").get().asFile
            fileTree(classesRoot) { include "**/*.class" }.files.each { classFile ->
                commonClasses.add(classesRoot.toPath().relativize(classFile.toPath()).toString())
            }
        }
        def shadowedClasses = []

        sourceSets.client.output.classesDirs.files.findAll { it.isDirectory() }.each { classesRoot ->
            fileTree(classesRoot) { include "**/*.class" }.files.each { classFile ->
                def relativePath = classesRoot.toPath().relativize(classFile.toPath()).toString()
                if (commonClasses.contains(relativePath)) {
                    shadowedClasses << relativePath
                }
            }
        }

        if (!shadowedClasses.isEmpty()) {
            throw new GradleException(
                    "Fabric adapter bytecode shadows Common SDK classes. " +
                            "Remove the duplicate source or run './gradlew clean' to clear stale outputs:\n" +
                            shadowedClasses.toSorted().join("\n"))
        }
    }
}

tasks.named("check") {
    dependsOn(verifyNoCommonClassShadowing)
}

def adapterArtifactDirectory = rootProject.layout.buildDirectory.dir("adapter-artifacts")
def adapterArtifactName = profileProperty("slim_adapter_artifact")
def generatedAdapterMetadataDirectory = layout.buildDirectory.dir("generated/adapter-metadata")
def productionJarTaskName = mappingsMode == "none" ? "jar" : "remapJar"
def normalizedPublicVersion = project.version.toString().replaceFirst(/^v/, "")
def internalAdapterVersion = "${normalizedPublicVersion}.mc.${minecraftTargetVersion.replaceAll(/[^0-9A-Za-z-]+/, '.')}"

def generateAdapterMetadata = tasks.register("generateAdapterMetadata") {
    group = "build"
    description = "Generate internal Fabric metadata for the selected slim adapter."
    outputs.dir(generatedAdapterMetadataDirectory)
    inputs.property("modVersion", project.version.toString())
    inputs.property("minecraftTargetVersion", minecraftTargetVersion)
    inputs.property("minecraftAdapterVersion", minecraftAdapterVersion)
    inputs.property("targetJavaVersion", targetJavaVersion)
    inputs.property("loaderVersion", loaderVersion)
    inputs.property("fabricApiVersion", fabricApiVersion)
    inputs.property("fabricApiModId", fabricApiModId)

    doLast {
        def outputRoot = generatedAdapterMetadataDirectory.get().asFile
        def adapterInfoRoot = new File(outputRoot, "META-INF/teamviewer")
        adapterInfoRoot.mkdirs()
        def fabricMetadata = [
                schemaVersion: 1,
                id: "team-view-relay-adapter",
                version: internalAdapterVersion,
                name: "TeamViewRelay Adapter ${minecraftTargetVersion}",
                description: "Internal Minecraft ${minecraftTargetVersion} adapter for TeamViewRelay.",
                environment: "client",
                depends: [
                        fabricloader: ">=${loaderVersion}",
                        minecraft: minecraftTargetVersion,
                        java: ">=${targetJavaVersion}",
                        (fabricApiModId): "*"
                ],
                custom: ["teamviewer:internal": true]
        ]
        new File(outputRoot, "fabric.mod.json").text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(fabricMetadata))
        def adapterInfo = [
                minecraft: minecraftTargetVersion,
                adapter: minecraftAdapterVersion,
                internalModVersion: internalAdapterVersion,
                sharedJavaRelease: sharedJavaVersion,
                adapterJavaRelease: targetJavaVersion,
                gameJavaVersion: gameJavaVersion,
                loader: loaderVersion,
                fabricApiModId: fabricApiModId,
                fabricApi: fabricApiVersion,
                serviceProvider: "fun.prof_chen.teamviewer.main_code.core.FabricClientAdapterFactory"
        ]
        new File(adapterInfoRoot, "adapter.json").text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(adapterInfo))
    }
}

def remapAdapterJar = tasks.register("remapAdapterJar", Jar) {
    group = "build"
    description = "Extract the already-remapped Minecraft adapter into an internal slim Jar."
    dependsOn(tasks.named(productionJarTaskName), generateAdapterMetadata)
    archiveFileName.set(adapterArtifactName)
    destinationDirectory.set(adapterArtifactDirectory)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.named(productionJarTaskName).get().archiveFile.get().asFile) }) {
        include "fun/**"
        exclude "fun/prof_chen/teamviewer/client/TeamviewerClient.class"
        include "META-INF/services/**"
        include "teamviewer.client.mixins.json"
    }
    from(generatedAdapterMetadataDirectory)
}

def verifyAdapterArtifact = tasks.register("verifyAdapterArtifact") {
    group = "verification"
    description = "Verify slim adapter contents, metadata, service provider, Mixin and bytecode release."
    dependsOn(remapAdapterJar)
    inputs.file(remapAdapterJar.flatMap { it.archiveFile })

    doLast {
        def adapterFile = remapAdapterJar.get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(adapterFile)
        try {
            def entryNames = zip.entries().collect { it.name } as Set
            def requiredEntries = [
                    "fabric.mod.json",
                    "META-INF/teamviewer/adapter.json",
                    "META-INF/services/fun.prof_chen.teamviewer.main_code.client.sdk.ClientAdapterFactory",
                    "teamviewer.client.mixins.json"
            ]
            def missing = requiredEntries.findAll { !entryNames.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Slim adapter ${minecraftTargetVersion} is missing: ${missing}")
            }
            def forbiddenPrefixes = [
                    "fun/prof_chen/teamviewer/client/TeamviewerClient",
                    "fun/prof_chen/teamviewer/main_code/client/ClientApplication",
                    "fun/prof_chen/teamviewer/main_code/client/ClientCoordinator",
                    "fun/prof_chen/teamviewer/protocol/",
                    "okhttp3/", "okio/", "com/fasterxml/jackson/", "com/google/protobuf/"
            ]
            def forbidden = entryNames.findAll { name -> forbiddenPrefixes.any { name.startsWith(it) } }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Slim adapter contains shared/runtime classes: ${forbidden.toSorted()}")
            }
            def sharedClasses = new HashSet<String>()
            [project(":common"), project(":common-sdk")].each { sharedProject ->
                def classesRoot = sharedProject.layout.buildDirectory.dir("classes/java/main").get().asFile
                fileTree(classesRoot) { include "**/*.class" }.files.each { classFile ->
                    sharedClasses.add(classesRoot.toPath().relativize(classFile.toPath()).toString().replace('\\', '/'))
                }
            }
            def sharedOverlap = entryNames.findAll { sharedClasses.contains(it) }
            if (!sharedOverlap.isEmpty()) {
                throw new GradleException("Slim adapter shadows Common SDK/runtime classes: ${sharedOverlap.toSorted()}")
            }
            def providerEntry = zip.getEntry(requiredEntries[2])
            def providers = zip.getInputStream(providerEntry).getText("UTF-8").readLines()
                    .collect { it.trim() }.findAll { !it.isEmpty() && !it.startsWith("#") }
            if (providers != ["fun.prof_chen.teamviewer.main_code.core.FabricClientAdapterFactory"]) {
                throw new GradleException("Slim adapter must expose exactly one factory; found ${providers}")
            }
            def mixin = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry("teamviewer.client.mixins.json")))
            if (!(mixin.client instanceof List) || mixin.client.isEmpty()) {
                throw new GradleException("Slim adapter must contain a non-empty client Mixin list")
            }
            int expectedMajor = targetJavaVersion + 44
            int maximumMajor = 0
            entryNames.findAll { it.endsWith(".class") }.each { name ->
                byte[] header = new byte[8]
                def stream = zip.getInputStream(zip.getEntry(name))
                try {
                    if (stream.read(header) != 8) throw new GradleException("Invalid class entry ${name}")
                } finally {
                    stream.close()
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                maximumMajor = Math.max(maximumMajor, major)
                if (major > expectedMajor) {
                    throw new GradleException("${name} has class major ${major}, expected <= ${expectedMajor}")
                }
            }
            if (maximumMajor != expectedMajor) {
                throw new GradleException("Slim adapter maximum class major ${maximumMajor}, expected ${expectedMajor}")
            }
        } finally {
            zip.close()
        }
    }
}

def verifyStandaloneArtifact = tasks.register("verifyStandaloneArtifact") {
    group = "verification"
    description = "Verify the selected standalone Jar remains complete and directly installable."
    dependsOn(tasks.named(productionJarTaskName), ":fabric-bootstrap:jar", ":client-bootstrap:jar",
            ":common:jar", ":common-sdk:jar")
    inputs.file(tasks.named(productionJarTaskName).flatMap { it.archiveFile })

    doLast {
        def standaloneFile = tasks.named(productionJarTaskName).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(standaloneFile)
        try {
            def entryNames = zip.entries().collect { it.name }
            def entries = entryNames as Set
            def descriptorEntry = zip.getEntry("fabric.mod.json")
            if (descriptorEntry == null) throw new GradleException("Standalone is missing fabric.mod.json")
            def descriptor = new groovy.json.JsonSlurper().parse(zip.getInputStream(descriptorEntry))
            if (descriptor.id != "team-view-relay"
                    || descriptor.depends?.minecraft != minecraftTargetVersion
                    || descriptor.depends?.java != ">=${gameJavaVersion}") {
                throw new GradleException("Standalone metadata does not match target ${minecraftTargetVersion}")
            }
            def nested = entryNames.findAll { it.startsWith("META-INF/jars/") && it.endsWith(".jar") }
            def requiredNestedPrefixes = [
                    "TeamViewRelay-common-", "TeamViewRelay-common-sdk-",
                    "okhttp-", "okio-jvm-", "kotlin-stdlib-", "protobuf-java-", "protobuf-java-util-", "luaj-jse-"
            ]
            requiredNestedPrefixes.each { prefix ->
                def matches = nested.findAll { name ->
                    def fileName = name.substring("META-INF/jars/".length())
                    if (prefix == "TeamViewRelay-common-") {
                        return fileName.startsWith(prefix) && !fileName.startsWith("TeamViewRelay-common-sdk-")
                    }
                    if (prefix == "protobuf-java-") {
                        return fileName.startsWith(prefix) && !fileName.startsWith("protobuf-java-util-")
                    }
                    fileName.startsWith(prefix)
                }
                if (matches.size() != 1) {
                    throw new GradleException("Standalone requires exactly one ${prefix} nested Jar; found ${matches}")
                }
            }
            if (nested.any { it.contains("teamviewer-adapter-") }) {
                throw new GradleException("Standalone must flatten its adapter instead of exposing the internal adapter ID")
            }
            if (nested.any { it.substring("META-INF/jars/".length()).startsWith("jackson-") }) {
                throw new GradleException("Standalone must not duplicate Minecraft's Jackson modules")
            }
            if (!entries.contains("fun/prof_chen/teamviewer/client/TeamviewerClient.class")) {
                throw new GradleException("Standalone is missing the shared Java 17 bootstrap entrypoint")
            }
            if (!entries.contains("fun/prof_chen/teamviewer/client/bootstrap/ClientBootstrap.class")) {
                throw new GradleException("Standalone is missing the Loader-neutral Java 17 client bootstrap")
            }
            def providerPath = "META-INF/services/fun.prof_chen.teamviewer.main_code.client.sdk.ClientAdapterFactory"
            def providerEntries = entryNames.findAll { it == providerPath }
            if (providerEntries.size() != 1) {
                throw new GradleException("Standalone must contain exactly one adapter provider resource")
            }
            def providers = zip.getInputStream(zip.getEntry(providerPath)).getText("UTF-8").readLines()
                    .collect { it.trim() }.findAll { !it.isEmpty() && !it.startsWith("#") }
            if (providers.size() != 1) {
                throw new GradleException("Standalone must expose exactly one adapter factory; found ${providers}")
            }
            if (!entries.contains("teamviewer.client.mixins.json")) {
                throw new GradleException("Standalone is missing its target Mixin config")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register("standaloneJar") {
    group = "build"
    description = "Build the complete standalone Jar for the selected Minecraft target."
    dependsOn(tasks.named(productionJarTaskName), verifyAdapterArtifact, verifyStandaloneArtifact)
}

tasks.named("build") {
    dependsOn(verifyAdapterArtifact, verifyStandaloneArtifact)
}

tasks.matching { it.name in ["runClient", "remapJar"] }.configureEach {
    dependsOn(verifyNoCommonClassShadowing)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    dependsOn(":fabric-bootstrap:classes", ":client-bootstrap:classes")
    from(project(":fabric-bootstrap").sourceSets.main.output)
    from(project(":client-bootstrap").sourceSets.main.output)
    from(rootProject.file("LICENSE.txt")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
